# 投稿スケジュール v2(JST)
# 毎日 朝6:00 と 夕方18:00 に、X・Instagram・Threads へ投稿します。
# 朝(_am)は random_ea(EAに関するネタ帳からランダム)。
# 夕(_pm)は new_article(公開済みで未告知の新記事を告知。posts_queue.csv の slot_id=any の行を
# 上から順に見て、noteで公開済みのものだけを告知する。無ければ自動で random_ea に切り替わる)。
slots:
  - {id: mon_am, weekday: mon, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: mon_pm, weekday: mon, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: tue_am, weekday: tue, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: tue_pm, weekday: tue, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: wed_am, weekday: wed, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: wed_pm, weekday: wed, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: thu_am, weekday: thu, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: thu_pm, weekday: thu, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: fri_am, weekday: fri, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: fri_pm, weekday: fri, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: sat_am, weekday: sat, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: sat_pm, weekday: sat, time: "18:00", platform: [x, instagram, threads], template: new_article}
  - {id: sun_am, weekday: sun, time: "06:00", platform: [x, instagram, threads], template: random_ea}
  - {id: sun_pm, weekday: sun, time: "18:00", platform: [x, instagram, threads], template: new_article}
