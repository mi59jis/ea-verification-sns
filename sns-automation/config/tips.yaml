# 「軽い投稿(tip)」用のコンテンツバンク。
#
# 新記事の告知(new_article/hook_single/carousel/warning)とは違い、
# 特定のレポート番号に紐づかない、いつ投稿しても内容が古くならない
# 短い教育的・エンゲージメント系の投稿です。posts_queue.csv の行を
# 消費しないため、投稿するたびに「使い切る」ことがなく、何度でも
# ローテーションで再利用できます。
#
# ローテーションの仕組み: post_scheduler.py が「その年の通算日数(day of
# year)」を使って tips リストから1件を選ぶため、当面は約1ヶ月ちょっとで
# 一周する形になります(項目数 x 日 で一周)。手動で並び替えたり増やしたり
# しても、コード側の変更は不要です。
#
# {hashtags_core} 等のプレースホルダは使わず、ハッシュタグは
# post_scheduler.py 側で自動的に末尾へ追記します
# (Instagramのみ hashtags_extra も追加)。

tips:
  - "PF(プロフィットファクター)とは、総利益÷総損失のこと。\n1を超えていれば期間内トータルではプラス、1未満ならマイナス。\nまず見るべき、いちばんシンプルな指標です。"

  - "最大ドローダウン(Max DD)とは、資産が一番減った時の下落幅のこと。\n最終的にプラスで終わったEAでも、途中で資産の半分近くまで減っていることがあります。\n「結果」だけでなく「道のり」も見る必要があります。"

  - "「勝率90%」という宣伝文句、実はあまり参考になりません。\n1回の負けが99回分の勝ちを吹き飛ばす設計のEAでも、勝率だけなら90%超えは簡単に作れます。\n見るべきはPFと最大DDです。"

  - "バックテストと実運用がズレる主な理由は3つ。\nスプレッド・スリッページ・ロスカット(証拠金不足による強制決済)。\n特にロスカットは、単純なバックテストでは考慮されないことが多いポイントです。"

  - "検証結果に「信頼区間(ブレ幅)」をつけているのは、たまたま良い(悪い)結果が出ただけの可能性を示すためです。\n取引数が少ないほど、このブレ幅は広くなります。"

  - "取引回数が30回に満たない検証結果は、参考程度に見るのがおすすめです。\nサイコロを10回振ってたまたま7回表が出ても、「表が出やすいサイコロ」とは言い切れないのと同じ理屈です。"

  - "「無料で公開されているEA」でも、実際に動かして検証する価値はあります。\n無料=検証されていない、という意味であって、無料=使えない、という意味ではありません。"

  - "グリッド系EA(価格が動くたびに注文を積み増していくタイプ)は、レンジ相場では強い一方、一方向に動き続ける相場では含み損が膨らみやすい傾向があります。"

  - "同じEAでも、通貨ペアや時間足を変えるだけで結果は大きく変わります。\n「このEAは儲かる/儲からない」ではなく、「この条件では」という前提を忘れないことが大切です。"

  - "レバレッジを上げると、同じ値動きでも損益(と証拠金に対する割合としてのドローダウン)が拡大します。\nハイレバレッジ設定の検証結果を見るときは、その前提条件も一緒に確認しましょう。"

  - "EAを選ぶときに見てほしい数字トップ3: ①PF(1を超えているか) ②最大DD(耐えられる水準か) ③取引数(結果の信頼度)。\n派手な宣伝文句より、この3つです。"

  - "「〇年間実運用中」という実績だけでは、判断材料としてはまだ弱いです。\nその期間の値動きがたまたま相性の良い相場だった可能性も、検証してみないと分かりません。"

  - "このシリーズでは、毎回10本まとめてEAを検証・公開しています。\n1本だけ良い結果を選んで紹介する、ということはしていません。良い結果も悪い結果もそのまま載せています。"

  - "マイナスの結果(損失や高いドローダウン)も、このシリーズでは隠さずそのまま公開しています。\n都合の良い数字だけ並べても、EA選びの役には立たないと考えているからです。"

  - "気になっている無料EAはありますか?\n次のレポートで検証してほしいEAがあれば、コメントやメッセージで教えてください。"

  - "1本のEA検証にかかる作業は、ダウンロード→バックテスト設定→実行→結果の集計・確認まで、だいたい30分〜1時間ほど。\n10本まとめて検証・公開する形で、このシリーズを続けています。"

  - "検証条件は毎回そろえています: 初期資金10,000ドル、レバレッジ1:500、MT5ストラテジーテスターの標準設定。\n条件をそろえることで、EA同士の結果をフェアに比較できるようにしています。"

  - "バックテストの「モデル」設定(ティックデータを使うか、始値だけで簡易計算するか)によって、同じEA・同じ期間でも結果の細かい数字が変わることがあります。\n検証条件は毎回明記するようにしています。"

  - "スキャルピング系EA(短時間で小さな利益を積み重ねるタイプ)は取引回数が多くなりやすい一方、スプレッドや約定タイミングの影響を強く受けやすい傾向があります。"

  - "「損失が出た」という結果も、実は重要な情報です。\nそのEAを避ける理由になるだけでなく、同じロジック系統の別EAを判断する材料にもなります。"
