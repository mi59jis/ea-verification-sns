# ネタ帳(その2): 公開済みnote記事の「無料部分」で既に出している数字と、
# EA選びの豆知識。tips.yaml と合わせて random_ea で使われます。
# from: YYYY-MM-DD を付けた項目は、その日以降だけ使われます(未公開記事のネタ漏れ防止)。
# 数字はすべて検証済みの公開記事(#1, #2)の無料部分と同じものです。

teasers:
  # ── 公開済み記事の数字(#1) ──
  - "【EA検証 #1】無料EA10本をバックテストした結果、黒字は2本だけでした。\n良い結果も悪い結果も、全部そのまま公開しています。\nhttps://note.com/eaanalysis/n/n3d6a1e21082f"
  - "金(XAUUSD)の1分足で動かした無料EA。894回の取引で、1万ドルが約3.2倍に。\nPF 1.65(ブレ幅 1.35〜2.02)、最大DD 11.7%。\nただしこれは「この条件では」の結果です。\nhttps://note.com/eaanalysis/n/n3d6a1e21082f"
  - "ランダムにエントリーするだけのEAでも、条件次第でこうなります。\nPF 0.83、最大ドローダウン81.6%。\n「それっぽいロジック」でも、数字を見ないと判断できません。\nhttps://note.com/eaanalysis/n/n3d6a1e21082f"

  # ── 公開済み記事の数字(#2) ──
  - "【EA検証 #2】無料EA10本のうち、黒字は4本。\n6本は損失でした。\n全部の数字を公開しています。\nhttps://note.com/eaanalysis/n/n30812fae9dd2"
  - "XAUUSD、4,802回の取引で1万ドルが約2.9倍に。\nPF 1.40(ブレ幅 1.16〜1.81)、最大DD 12.9%。\n取引数が多いと、ブレ幅も狭くなります。\nhttps://note.com/eaanalysis/n/n30812fae9dd2"
  - "NZDUSD 3時間足のEA。取引63回で、最大ドローダウンは100%(口座残高が尽きた水準)、PF 0.45。\nブレ幅は0.17〜2.36と非常に広く、「判断材料としては弱い」結果です。\nhttps://note.com/eaanalysis/n/n30812fae9dd2"

  # ── EA選びの豆知識(いつ投稿しても古くならないもの) ──
  - "EAを検証するときは、まず「取引数」を見ます。\n取引数が少ない結果は、たまたま良い(悪い)だけの可能性が高く、ブレ幅も広くなります。\nPFの数字だけで判断しないのがコツです。"
  - "ブレ幅(信頼区間)の下限がPF 1を超えていれば、「たまたま」では説明しにくい結果と言えます。\nこのシリーズでは、この基準をクリアしたEAは意外と少数です。"
  - "バックテストでは、同じ期間でもモデル(全ティック/始値のみ)でPFが変わります。\n結果を比べるときは、検証条件がそろっているかを必ず確認しましょう。"
  - "最大DDが小さいEAでも、取引数が少なければ「まだ大きく負けていないだけ」の可能性があります。\nDDは取引数とセットで見るのがおすすめです。"
  - "1分足のEAは取引回数が増えるぶん、結果の信頼度は上がりやすい一方、スプレッドの影響も大きくなります。\n実運用の口座条件で再確認するのが安全です。"
  - "ナンピン・マーチンゲール系のEAは、勝率が高く見えやすい反面、1回の大きな逆行で資金の大半を失うことがあります。\n勝率より、最大DDとブレ幅を見てください。"
  - "EAの検証結果を見るとき、「最終資産」だけでなく「どんな道のりでそこに着いたか」(最大DD)を見ましょう。\n同じ+50%でも、DD10%とDD70%では全く別物です。"
  - "無料EAは玉石混交です。\nただ、検証してみると、黒字のものもあれば大きくマイナスのものもあります。\n結局、数字で見るしかありません。"
  - "期間を変えると、同じEAの結果は変わります。\n短い期間で好成績のEAは、その期間の相場と相性が良かっただけかもしれません。\n複数期間での確認が理想です。"
  - "EAの「利益」だけを見て選ぶと、リスク(最大DD)を見落とします。\n目安として、PFと最大DDの2つをセットで見る習慣をつけましょう。"
  - "「作者が金(ゴールド)向けに最適化している」EAを、別の通貨ペアで検証すると結果が崩れることがあります。\nEAごとの想定条件を確認するのは大事な作業です。"
  - "検証結果が悪いEAを見つけたら、「なぜ悪いか」を考えるのも勉強になります。\nロジックの弱点、相性の悪い時間足、スプレッドの影響など、原因を探ると次の選び方に活きます。"
  - "デモ口座で動かす前に、バックテストで最低限のふるい分けをしておくと、時間を大きく節約できます。\nPF・DD・取引数の3点を確認するだけでも十分です。"
  - "このシリーズは、毎回10本ずつ、月・水・金の20時にnoteで公開していきます。\n気になるEAがあればコメントで教えてください。"
  - "ブートストラップ法で、取引の並びを何千通りも作り直して、PFや最大DDの「ブレ幅」を出しています。\n難しく聞こえますが、要は「たまたま」かどうかを確かめる作業です。"
  - "EAの検証では、証拠金やロット設定を変えるだけで、DDの数字は大きく動きます。\nこのシリーズでは、初期資金・レバレッジ・ロット設定を毎回そろえて比較しています。"

