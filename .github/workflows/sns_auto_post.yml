name: SNS auto post (EA検証ラボ)

on:
  schedule:
    # すべて UTC 表記(JSTの-9時間)。毎日2回(朝8時台・夜20時台 JST)。
    # 「ちょうど0分」は混雑して遅延しやすいため、分をずらしている。
    # 判定は post_scheduler.py 側で行い、数時間の遅延も吸収する。
    - cron: "5 21 * * *"
    - cron: "35 21 * * *"
    - cron: "5 9 * * *"
    - cron: "35 9 * * *"
    # MT4編の告知枠(config/mt4_posts.csv)。月水金の 8:00 と 13:00 JST 頃
    - cron: "5 23 * * 0,2,4"
    - cron: "5 4 * * 1,3,5"
  workflow_dispatch:      # 手動実行・DRY_RUNでのテスト用
    inputs:
      dry_run:
        description: "true にすると投稿せず内容だけ表示します"
        required: false
        default: "false"

concurrency:
  group: sns-auto-post
  cancel-in-progress: false

permissions:
  contents: write   # posts_queue.csv の posted フラグをコミットし直すため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r sns-automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore X session (storage_state)
        run: |
          echo "${{ secrets.X_STORAGE_STATE_B64 }}" | base64 -d > sns-automation/x_storage_state.json

      - name: Run scheduler
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IMAGE_PUBLIC_BASE_URL: ${{ secrets.IMAGE_PUBLIC_BASE_URL }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          cd sns-automation
          python scripts/post_scheduler.py

      - name: Commit updated queue / state
        if: always()
        run: |
          git config user.name "sns-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A sns-automation/config
          git diff --cached --quiet || git commit -m "chore: update posts_queue.csv / last_run.json"
          git pull --rebase || true
          git push
